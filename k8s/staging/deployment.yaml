apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-task-api
  namespace: staging
  labels:
    app: devops-task-api
    environment: staging

spec:
  replicas: 2

  selector:
    matchLabels:
      app: devops-task-api

  template:
    metadata:
      labels:
        app: devops-task-api
        environment: staging

    spec:
      imagePullSecrets:
        - name: ghcr-secret

      containers:
        - name: devops-task-api
          image: ghcr.io/niraj-mx07/devops-k8s-cicd-platform:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8080
              protocol: TCP

          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3