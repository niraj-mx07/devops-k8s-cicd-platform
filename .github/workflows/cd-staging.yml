name: CD - Deploy to Staging

on:
  workflow_run:
    workflows:
      - "Build and Push Docker Image"
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: self-hosted

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Show deployment information
        run: |
          echo "Commit SHA:"
          echo "${{ github.event.workflow_run.head_sha }}"

          echo "Image:"
          echo "ghcr.io/niraj-mx07/devops-k8s-cicd-platform:${{ github.event.workflow_run.head_sha }}"

      - name: Verify Kubernetes connection
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Verify staging deployment
        run: |
          kubectl get deployment devops-task-api -n staging
          kubectl get pods -n staging

      - name: Deploy exact Git SHA image
        env:
          IMAGE: ghcr.io/niraj-mx07/devops-k8s-cicd-platform:${{ github.event.workflow_run.head_sha }}
        run: |
          echo "Deploying $IMAGE"

          kubectl set image deployment/devops-task-api \
            devops-task-api="$IMAGE" \
            -n staging

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/devops-task-api \
            -n staging \
            --timeout=180s

      - name: Show deployed image
        run: |
          kubectl get deployment devops-task-api \
            -n staging \
            -o jsonpath='{.spec.template.spec.containers[0].image}'

          echo ""

      - name: Show running pods
        run: |
          kubectl get pods -n staging -o wide

      - name: Run smoke test
        run: |
          chmod +x scripts/smoke-test.sh
          ./scripts/smoke-test.sh
